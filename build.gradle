plugins {
    id "java"
    id 'jacoco'
    id 'com.diffplug.spotless' version '6.25.0'
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
    id "com.peterabeles.gversion" version "1.10"
    id 'com.github.spotbugs' version '6.0.26'
    // id 'net.ltgt.errorprone' version '5.1.0'  // disabled temporarily to reduce build output
    id 'org.openrewrite.rewrite' version '7.30.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Create commit with working changes on event branches
task(eventDeploy) {
    doLast {
        if (project.gradle.startParameter.taskNames.any({ it.toLowerCase().contains("deploy") })) {
            def eventBranchPrefix = "event"
            def practiceBranchPrefix = "practice"
            def branch = 'git branch --show-current'.execute().text.trim()
            def commitMessage = "Update at '${new Date().toString()}'"

            if (branch.startsWith(eventBranchPrefix) || branch.startsWith(practiceBranchPrefix)) {
                exec {
                    workingDir(projectDir)
                    executable 'git'
                    args 'add', '-A'
                }
                exec {
                    workingDir(projectDir)
                    executable 'git'
                    args 'commit', '-m', commitMessage
                    ignoreExitValue = true
                }

                println "Committed to branch: '$branch'"
                println "Commit message: '$commitMessage'"
            } else {
                println "Not on an event branch, skipping commit"
            }
        } else {
            println "Not running deploy task, skipping commit"
        }
    }
}

// Create version file
project.compileJava.dependsOn(createVersionFile)
createVersionFile.dependsOn(eventDeploy)
gversion {
    srcDir       = "src/main/java/"
    classPackage = "frc.robot"
    className    = "BuildConstants"
    dateFormat   = "yyyy-MM-dd HH:mm:ss z"
    timeZone     = "America/Los_Angeles"
    indent       = "  "
}

// SpotBugs static analysis
spotbugs {
    ignoreFailures = false
    excludeFilter = file('spotbugs-exclude.xml')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask) {
    reports {
        html {
            required = true
            outputLocation = layout.buildDirectory.file("reports/spotbugs/spotbugs.html")
            stylesheet = 'fancy-hist.xsl'
        }
        xml.required = false
    }
}

// Only run SpotBugs when explicitly invoked (e.g., ./gradlew spotbugsMain).
// Skips automatically during build/check lifecycle.
tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    onlyIf {
        gradle.startParameter.taskNames.any { it.toLowerCase().contains('spotbugs') }
    }
}

// OpenRewrite automated code cleanup and modernization
// Apply fixes:   ./gradlew rewriteRun
// Preview only:  ./gradlew rewriteDryRun
rewrite {
    activeRecipe('org.openrewrite.staticanalysis.CommonStaticAnalysis')
}

// Spotless formatting
project.compileJava.dependsOn(spotlessApply)
spotless {
    enforceCheck false  // Don't automatically run spotlessCheck during build
    java {
        target fileTree(".") {
            include "**/*.java"
            exclude "**/build/**", "**/build-*/**", ".*/**", "**/BuildConstants.java"
        }
        toggleOffOn()
        googleJavaFormat()
    }
    groovyGradle {
        target fileTree(".") {
            include "**/*.gradle"
            exclude "**/build/**", "**/build-*/**", ".*/**"
        }
        greclipse()
        indentWithSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
    json {
        target fileTree(".") {
            include "**/*.json"
            exclude "**/build/**", "**/build-*/**", ".*/**"
        }
        gson().indentWithSpaces(2)
    }
    format "misc", {
        target fileTree(".") {
            include "**/*.md", "**/.gitignore"
            exclude "**/build/**", "**/build-*/**", ".*/**"
        }
        trimTrailingWhitespace()
        indentWithSpaces(2)
        endWithNewline()
    }
}


// Automated test approach based on FRC 2412: https://github.com/robototes/REBUILT2026
def getProjectBooleanProperty(String name, boolean defaultValue = false) {
    if (!project.hasProperty(name)) {
        return defaultValue
    }
    return Boolean.parseBoolean(project.getProperty(name))
}

def ROBOT_MAIN_CLASS = getProjectBooleanProperty('automatedTest') ? "frc.robot.test.AutomatedTestMain" : "frc.robot.Main"

/**
 * Works out whether the connected roboRIO is a 1 or a 2 from its image metadata
 * (IMAGEVERSION = "FRC_roboRIO2_2026_v1.2" on a roboRIO 2, "FRC_roboRIO_2026_v1.2" on a roboRIO 1).
 * Pass -ProboRIO=1 or -ProboRIO=2 to skip detection and force a model.
 * If the model can't be determined, falls back to roboRIO 1, whose JVM settings are safe on both.
 */
def detectRoboRioModel(context) {
    if (project.hasProperty('roboRIO')) {
        def forcedModel = project.getProperty('roboRIO').toString().trim()
        if (!(forcedModel in ['1', '2'])) {
            throw new GradleException("Invalid -ProboRIO=${forcedModel}, expected 1 or 2")
        }
        context.logger.log("roboRIO ${forcedModel} JVM settings forced by -ProboRIO")
        return forcedModel as int
    }

    def imageMetadata = context.execute('cat /etc/natinst/share/scs_imagemetadata.ini').result ?: ''
    def imageVersion = imageMetadata =~ /(?m)^IMAGEVERSION\s*=\s*"(?:FRC_)?roboRIO(2?)_/
    if (!imageVersion.find()) {
        context.logger.log("WARNING: Could not detect the roboRIO model, using roboRIO 1 JVM settings")
        return 1
    }
    def model = imageVersion.group(1) ? 2 : 1
    context.logger.log("Detected roboRIO ${model}, using its JVM settings")
    return model
}

/**
 * Tunes the JVM for the given roboRIO model.
 * Credit to 6328 for getting our team thinking about this.
 */
def configureJvmForRoboRio(javaArtifact, int roboRioModel) {
    if (roboRioModel == 2) {
        javaArtifact.gcType = edu.wpi.first.gradlerio.deploy.roborio.GarbageCollectorType.G1_Base
        javaArtifact.jvmArgs.add("-XX:MaxGCPauseMillis=20")
        javaArtifact.jvmArgs.add("-XX:GCTimeRatio=5")
        // roboRIO 2 is dual-core: pin thread counts explicitly so the JVM
        // doesn't over-allocate if it misreads the core count (e.g. in a cgroup).
        // ConcGCThreads=1 ensures concurrent marking leaves one core for robot code.
        javaArtifact.jvmArgs.add("-XX:ParallelGCThreads=2")
        javaArtifact.jvmArgs.add("-XX:ConcGCThreads=1")

        final MAX_JAVA_HEAP_SIZE_MB = 100
        javaArtifact.jvmArgs.add("-Xmx" + MAX_JAVA_HEAP_SIZE_MB + "M")
        javaArtifact.jvmArgs.add("-Xms" + MAX_JAVA_HEAP_SIZE_MB + "M")
        javaArtifact.jvmArgs.add("-XX:+AlwaysPreTouch")
    } else {
        // roboRIO 1 has far less RAM: serial GC and a smaller heap keep it from running out.
        javaArtifact.gcType = edu.wpi.first.gradlerio.deploy.roborio.GarbageCollectorType.Other
        javaArtifact.jvmArgs.add("-XX:+UseSerialGC")

        final MAX_JAVA_HEAP_SIZE_MB = 70
        javaArtifact.jvmArgs.add("-Xmx" + MAX_JAVA_HEAP_SIZE_MB + "M")
    }
}

// Define my targets (RoboRIO) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
    targets {
        roborio(getTargetTypeClass('RoboRIO')) {
            // Team number is loaded either from the .wpilib/wpilib_preferences.json
            // or from command line. If not found an exception will be thrown.
            // You can use getTeamOrDefault(team) instead of getTeamNumber if you
            // want to store a team number in this file.
            team = project.frc.getTeamNumber()
            debug = project.frc.getDebugOrDefault(false)

            artifacts {
                // First part is artifact name, 2nd is artifact type
                // getTargetTypeClass is a shortcut to get the class type using a string

                frcJava(getArtifactTypeClass('FRCJavaArtifact')) {
                    def javaArtifact = delegate
                    // GradleRIO reads gcType and jvmArgs when it writes robotCommand during the
                    // deploy, so they can be chosen here, once we're connected to the roboRIO and
                    // can tell which model it is.
                    robotCommandArtifact.predeploy.add({ context ->
                        configureJvmForRoboRio(javaArtifact, detectRoboRioModel(context))
                    } as Action)
                }

                // Static files artifact
                frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/lvuser/deploy'
                    deleteOldFiles = true // Change to true to delete files on roboRIO that no
                    // longer exist in deploy directory of this project
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.roborio.artifacts.frcJava

// Set to true to use debug for all targets including JNI, which will drastically impact
// performance.
wpi.java.debugJni = false

// Set this to true to enable desktop support.
def includeDesktopSupport = true
task(replayWatch, type: JavaExec) {
    mainClass = "org.littletonrobotics.junction.ReplayWatch"
    classpath = sourceSets.main.runtimeClasspath
}
// Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
// Also defines JUnit 5.
dependencies {
    def akitJson = new groovy.json.JsonSlurper().parseText(new File(projectDir.getAbsolutePath() + "/vendordeps/AdvantageKit.json").text)
    annotationProcessor "org.littletonrobotics.akit:akit-autolog:$akitJson.version"
    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    roborioDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.roborio)
    roborioDebug wpi.java.vendor.jniDebug(wpi.platforms.roborio)

    roborioRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.roborio)
    roborioRelease wpi.java.vendor.jniRelease(wpi.platforms.roborio)

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Error Prone 2.43+ requires Java 21; 2.42.0 is the last Java-17-compatible release
    // errorprone 'com.google.errorprone:error_prone_core:2.42.0'  // disabled temporarily

    rewrite platform('org.openrewrite.recipe:rewrite-recipe-bom:3.28.0')
    rewrite 'org.openrewrite.recipe:rewrite-static-analysis'
}

test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    finalizedBy jacocoTestReport
}

// JaCoCo coverage report — generated automatically after each test run.
// View the report: open build/reports/jacoco/test/html/index.html
jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = false
        csv.required = false
    }
    doLast {
        def reportPath = layout.buildDirectory.file("reports/jacoco/test/html/index.html").get().asFile.toURI()
        println "Coverage report: $reportPath"
    }
}

// Simulation configuration (e.g. environment variables).
wpi.sim.addGui().defaultEnabled = true
wpi.sim.addDriverstation()

// Setting up my Jar File. In this case, adding all libraries into the main jar ('fat jar')
// in order to make them all available at runtime. Also adding the manifest so WPILib
// knows where to look for our Robot Class.
jar {
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    from('src') { into 'backup/src' }
    from('vendordeps') { into 'backup/vendordeps' }
    from('build.gradle') { into 'backup' }
    manifest edu.wpi.first.gradlerio.GradleRIOPlugin.javaManifest(ROBOT_MAIN_CLASS)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Configure jar and deploy tasks
deployArtifact.jarTask = jar
wpi.java.configureExecutableTasks(jar)
wpi.java.configureTestTasks(test)

// Configure string concat to always inline compile
tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
}

