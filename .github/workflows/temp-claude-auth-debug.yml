# TEMP: debug Claude OAuth token in CI. Delete before merging.
name: TEMP Claude Auth Debug

on:
  pull_request:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Check token shape (no secret printed)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "length: ${#CLAUDE_CODE_OAUTH_TOKEN}"
          echo "prefix: ${CLAUDE_CODE_OAUTH_TOKEN:0:13}"
          if [[ "$CLAUDE_CODE_OAUTH_TOKEN" =~ [[:space:]] ]]; then echo "contains whitespace: yes"; else echo "contains whitespace: no"; fi

      - name: Default model
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        continue-on-error: true
        run: ~/.local/bin/claude -p "say hi" --output-format json

      - name: Same model as review workflow
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        continue-on-error: true
        run: ~/.local/bin/claude -p "say hi" --model claude-sonnet-5-5 --output-format json
